<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>{% block title %}Meine Bücher{% endblock %}</title>
</head>
<body>
    {% block content %}
    <h1>Meine Bücher</h1>

    <div class="books-grid">
    {% for book in books %}
        <article class="book-card">
            <a href="{{ url_for('book_detail', book_id=book.id) }}">
                <h2>{{ book.title }}</h2>
                <p class="meta">{{ book.author }}</p>
                <p class="status">{{ book.status }}</p>
            </a>
        </article>
    {% endfor %}
    </div>
    {% endblock %}
</body>
</html>
