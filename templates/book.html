<h1>{{ book.title }}</h1>
<p>Autor: {{ book.author }}</p>
<p>Status: {{ book.status }}</p>

<h3>Notizen</h3>
<ul>
{% for note in book.notes %}
    <li>{{ note.date }} - {{ note.text }}</li>
{% endfor %}
</ul>

<form method="post">
    <input type="text" name="note" placeholder="Neue Notiz">
    <select name="status">
        <option value="planned" {% if book.status=='planned' %}selected{% endif %}>Planned</option>
        <option value="reading" {% if book.status=='reading' %}selected{% endif %}>Reading</option>
        <option value="read" {% if book.status=='read' %}selected{% endif %}>Read</option>
    </select>
    <button type="submit">Speichern</button>
</form>

<a href="{{ url_for('index') }}">Zurück</a>
