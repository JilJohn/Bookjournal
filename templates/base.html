<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Book Journal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ url_for('index') }}">Book Journal</a>

      <div class="nav-actions">
        {% if session.get('user_id') %}
          <a href="{{ url_for('index') }}">Übersicht</a>
          <a href="{{ url_for('add_book') }}">Buch hinzufügen</a>
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}">Login</a>
          <a href="{{ url_for('register') }}">Registrieren</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>©️ {{ (current_year or "") }}</small>
  </footer>
</body>
</html>
