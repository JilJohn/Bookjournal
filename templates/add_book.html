<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Work Sans', sans-serif;
      background-color: var(--background, #fff);
      color: var(--foreground, #000);
      padding: 20px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .book-card {
      background-color: gray; /* graue Box */
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .book-card:hover {
      transform: scale(1.05); /* kleiner Hover-Effekt */
    }

    .meta {
      font-size: 0.9em;
      color: #ddd;
    }

    .status {
      margin-top: 10px;
      font-weight: 600;
    }

    .form {
      max-width: 520px;
      margin: 0 auto;
    }

    .form label {
      display: block;
      margin-bottom: 0.5rem;
    }

    .form input,
    .form select {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form button {
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .form a {
      margin-left: 0.5rem;
      color: var(--muted);
      text-decoration: none;
    }
  </style>
</head>
<body>
  {% extends "base.html" %}
  {% block title %}Buch hinzufügen{% endblock %}
  {% block content %}
    <h1>Neues Buch hinzufügen</h1>

    <form method="POST" class="form">
      <label for="title">Titel</label>
      <input id="title" name="title" type="text" required>

      <label for="author">Autor</label>
      <input id="author" name="author" type="text">

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="Geplantes Buch">Geplantes Buch</option>
        <option value="aktuelles Buch">Aktuelles Buch</option>
        <option value="abgeschlossenes Buch">Abgeschlossenes Buch</option>
      </select>

      <div style="margin-top:.5rem;">
        <button type="submit">Hinzufügen</button>
        <a href="{{ url_for('index') }}" style="margin-left:.5rem;color:var(--muted);text-decoration:none;">Abbrechen</a>
      </div>
    </form>
  {% endblock %}
</body>
</html>
