{% extends "base.html" %}
{% block title %}Buch hinzufügen{% endblock %}
{% block content %}
  <h1>Neues Buch hinzufügen</h1>

  <form method="POST" class="form">
    <label for="title">Titel</label>
    <input id="title" name="title" type="text" required>

    <label for="author">Autor</label>
    <input id="author" name="author" type="text">

    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="Geplantes Buch">Geplantes Buch</option>
      <option value="aktuelles Buch">Aktuelles Buch</option>
      <option value="abgeschlossenes Buch">Abgeschlossenes Buch</option>
    </select>

    <div class="button-container">
      <button type="submit">Hinzufügen</button>
      <a href="{{ url_for('index') }}">Abbrechen</a>
    </div>
  </form>
{% endblock %}
